name: Java CI

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, test, and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-${{ runner.os }}
          path: target/hello-world-1.0.0.jar
          if-no-files-found: error
          retention-days: 7

